---
layout: default
---
<span class="post-meta">{{ page.date | date: "%B %d, %Y" }}</span>
<h2>{{ page.heading | default: page.title }}</h2>
{% if page.hero_image %}
  <figure class="post-hero">
    <img src="{{ page.hero_image | relative_url }}" alt="{{ page.hero_image_alt }}">
  </figure>
{% endif %}
{{ content }}
<br />
{% assign cta = page.cta | default: "management" %}
{% if cta != "none" %}
  {% include cta-{{ cta }}.html %}
{% endif %}
